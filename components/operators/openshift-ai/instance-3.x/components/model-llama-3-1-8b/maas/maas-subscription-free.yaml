apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: llama-3-1-8b-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Llama 3 1 8B Free Tier"
    openshift.io/description: "Free tier: 100000 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: llama-3-1-8b-instruct-distributed
      namespace: llm
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 10