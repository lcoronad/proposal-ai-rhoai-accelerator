version: "2"
distro_name: rh
apis:
- responses
- file_processors
- files
- inference
- tool_runtime
- vector_io
providers:
  inference:
    - provider_id: sentence-transformers
      provider_type: inline::sentence-transformers
      config:
        trust_remote_code: false
    - provider_id: vllm-inference
      provider_type: remote::vllm
      config:
        base_url: ${env.VLLM_URL:=}
        max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
        api_token: ${env.VLLM_API_TOKEN:=fake}
        tls_verify: ${env.VLLM_TLS_VERIFY:=true}
    - provider_id: ${env.VLLM_EMBEDDING_URL:+vllm-embedding}
      provider_type: remote::vllm
      config:
        base_url: ${env.VLLM_EMBEDDING_URL:=}
        max_tokens: ${env.VLLM_EMBEDDING_MAX_TOKENS:=4096}
        api_token: ${env.VLLM_EMBEDDING_API_TOKEN:=fake}
        tls_verify: ${env.VLLM_EMBEDDING_TLS_VERIFY:=true}
  vector_io:
    - provider_id: milvus-remote
      provider_type: remote::milvus
      config:
        uri: ${env.MILVUS_ENDPOINT:=}
        token: ${env.MILVUS_TOKEN:=}
        secure: ${env.MILVUS_SECURE:=}
        consistency_level: ${env.MILVUS_CONSISTENCY_LEVEL:=}
        ca_pem_path: ${env.MILVUS_CA_PEM_PATH:=}
        client_pem_path: ${env.MILVUS_CLIENT_PEM_PATH:=}
        client_key_path: ${env.MILVUS_CLIENT_KEY_PATH:=}
        persistence:
          backend: kv_default
          namespace: vector_io::milvus_remote
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        responses:
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
          table_name: responses
  file_processors:
  - provider_id: pypdf
    provider_type: inline::pypdf
    config: {}
  files:
  - provider_id: localfs-files
    provider_type: inline::localfs
    config:
      metadata_store:
        backend: sql_default
        table_name: files_metadata
      storage_dir: /opt/app-root/src/.llama/distributions/rh/files
  tool_runtime:
  - provider_id: file-search
    provider_type: inline::file-search
    config: {}
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
    config: {}
metadata_store:
  type: sqlite
  db_path: /opt/app-root/src/.llama/distributions/rh/inference_store.db
storage:
  backends:
    kv_default:
      db_path: /opt/app-root/src/.llama/distributions/rh/kvstore.db
      type: kv_sqlite
    sql_default:
      db_path: /opt/app-root/src/.llama/distributions/rh/sql_store.db
      type: sql_sqlite
  stores:
    connectors:
      backend: sql_default
      table_name: connectors
    conversations:
      backend: sql_default
      table_name: openai_conversations
    inference:
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
      table_name: inference_store
    metadata:
      backend: kv_default
      namespace: registry
    prompts:
      backend: sql_default
      table_name: prompts
vector_stores:
  default_provider_id: milvus-remote
  default_embedding_model:
    provider_id: sentence-transformers
    model_id: ibm-granite/granite-embedding-125m-english
  annotation_prompt_params:
    enable_annotations: true
  file_ingestion_params:
    default_chunk_overlap_tokens: 128
    default_chunk_size_tokens: 512
  chunk_retrieval_params:
    chunk_multiplier: 5
    default_reranker_strategy: rrf
    default_search_mode: vector
    max_tokens_in_context: 4000
    rrf_impact_factor: 60
    weighted_search_alpha: 0.5
  file_batch_params:
    cleanup_interval_seconds: 86400
    file_batch_chunk_size: 10
    max_concurrent_files_per_batch: 3
registered_resources:
  models:
  - provider_id: sentence-transformers
    model_id: sentence-transformers/ibm-granite/granite-embedding-125m-english
    provider_model_id: ibm-granite/granite-embedding-125m-english
    model_type: embedding
    metadata:
      embedding_dimension: 768
  - provider_id: vllm-inference
    model_id: llama-3-1-8b-instruct
    model_type: llm
    max_tokens: 2000
    metadata:
      display_name: distributed/Llama-3.1-8B-Instruct
  vector_stores: []
external_providers_dir: /opt/app-root/.llama/providers.d
tool_groups:
- toolgroup_id: builtin::websearch
  provider_id: tavily-search
- toolgroup_id: builtin::rag
  provider_id: rag-runtime
- toolgroup_id: ocp::proposal
  provider_id: model-context-protocol
  mcp_endpoint:
    uri: ${env.MCP_SERVER_OCP_URL:http://192.168.68.122:7860/gradio_api/mcp/sse}
server:
  port: 8321