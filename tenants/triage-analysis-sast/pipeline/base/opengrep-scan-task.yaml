apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: opengrep-scan-task
spec:
  workspaces:
    - name: source-dir
  steps:
    - name: opengrep-scan
      env:
        - name: XDG_CACHE_HOME
          value: "$(workspaces.source-dir.path)/.cache"
        - name: HOME
          value: "/tmp"
      image: image-registry.openshift-image-registry.svc:5000/triage-analysis-sast/opengrep-scan:latest
      workingDir: $(workspaces.source-dir.path)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 1001
      script: |
        #!/bin/sh
        cd "$(workspaces.source-dir.path)"
        SCAN_CONFIG=""
        if [ -f pom.xml ]; then
          SCAN_CONFIG="$SCAN_CONFIG --config=p/java"
        fi
        if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
          SCAN_CONFIG="$SCAN_CONFIG --config=p/python"
        fi
        if [ -f .semgrep/demo-java.yaml ]; then
          SCAN_CONFIG="$SCAN_CONFIG --config=.semgrep/demo-java.yaml"
        fi
        if [ -f .semgrep/demo-python.yaml ]; then
          SCAN_CONFIG="$SCAN_CONFIG --config=.semgrep/demo-python.yaml"
        fi
        if [ -z "$SCAN_CONFIG" ]; then
          SCAN_CONFIG="--config=auto"
        fi
        echo "OpenGrep scan config:$SCAN_CONFIG"
        /root/.opengrep/cli/latest/opengrep scan $SCAN_CONFIG \
          --sarif \
          --output="$(workspaces.source-dir.path)/opengrep-results.sarif" || true
        echo -n "SARIF findings: "
        jq '[.runs[]?.results[]?] | length' opengrep-results.sarif 2>/dev/null || echo "0"
