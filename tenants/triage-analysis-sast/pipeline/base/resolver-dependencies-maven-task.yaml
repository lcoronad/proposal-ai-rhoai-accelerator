apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: resolver-dependencies-maven-task
spec:
  workspaces:
    - name: source-dir
  steps:
    - name: resolver-dependencies-maven
      env:
        - name: HOME
          value: "$(workspaces.source-dir.path)"
      image: image-registry.openshift-image-registry.svc:5000/triage-analysis-sast/consume-agent:1.0.1
      workingDir: $(workspaces.source-dir.path)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 1001
      script: |
        #!/bin/sh
        set -e
        cd "$(workspaces.source-dir.path)"

        if [ ! -f pom.xml ]; then
          echo "Sin pom.xml — omitiendo resolución Maven"
          exit 0
        fi

        cat > /tmp/maven-settings.xml <<'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <profiles>
            <profile>
              <id>security-scan-repos</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                </repository>
                <repository>
                  <id>redhat-ga</id>
                  <url>https://maven.repository.redhat.com/ga/</url>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                </pluginRepository>
                <pluginRepository>
                  <id>redhat-ga</id>
                  <url>https://maven.repository.redhat.com/ga/</url>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>security-scan-repos</activeProfile>
          </activeProfiles>
        </settings>
        EOF

        M2_REPO="$(workspaces.source-dir.path)/.m2/repository"
        mkdir -p "$M2_REPO"

        echo "Resolviendo dependencias Maven en $M2_REPO ..."
        mvn -s /tmp/maven-settings.xml \
          -Dmaven.repo.local="$M2_REPO" \
          -B dependency:resolve dependency:resolve-plugins -DskipTests || {
            echo "WARN: mvn dependency:resolve falló; Trivy usará --offline-scan y puede omitir dependencias no cacheadas"
            exit 0
          }

        POM_COUNT="$(find "$M2_REPO" -name '*.pom' 2>/dev/null | wc -l | tr -d ' ')"
        echo "Dependencias Maven resueltas: $POM_COUNT POM(s) en cache local"
