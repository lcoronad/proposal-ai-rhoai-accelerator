apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: trivy-scan-task
spec:
  workspaces:
    - name: source-dir
  steps:
    - name: trivy-scan
      env:
        - name: TRIVY_CACHE_DIR
          value: "$(workspaces.source-dir.path)/.trivy-cache"
        - name: HOME
          value: "$(workspaces.source-dir.path)"
      image: aquasec/trivy:latest
      workingDir: $(workspaces.source-dir.path)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 1001
      script: |
        #!/bin/sh
        cd "$(workspaces.source-dir.path)"

        TRIVY_OPTS="--scanners vuln --format json --output $(workspaces.source-dir.path)/trivy-results.json"

        if [ -f pom.xml ]; then
          M2_REPO="$(workspaces.source-dir.path)/.m2/repository"
          if [ -d "$M2_REPO" ] && [ -n "$(find "$M2_REPO" -name '*.pom' 2>/dev/null | head -1)" ]; then
            POM_COUNT="$(find "$M2_REPO" -name '*.pom' 2>/dev/null | wc -l | tr -d ' ')"
            echo "Cache Maven: $POM_COUNT POM(s) — escaneo offline (sin peticiones a Maven Central)"
            TRIVY_OPTS="$TRIVY_OPTS --offline-scan"
          else
            echo "WARN: cache Maven vacío en $M2_REPO — riesgo de HTTP 429 en Maven Central"
            echo "       Ejecute resolver-dependencies-maven antes de Trivy o espere Retry-After si el IP está bloqueado"
          fi
        fi

        trivy fs $TRIVY_OPTS . || true
        echo -n "Trivy CVEs encontrados: "
        jq '[.Results[]?.Vulnerabilities[]?] | length' "$(workspaces.source-dir.path)/trivy-results.json" 2>/dev/null || echo "0"